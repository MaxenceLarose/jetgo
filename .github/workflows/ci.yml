name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with Pythia8 and the test tools
        run: pip install -e ".[pythia,dev]"

      - name: Run the full suite
        run: pytest -v --cov=jetgo --cov-report=term-missing

  test-without-pythia:
    # Pythia8 is an optional dependency, and its wheels are Linux-only. Every observable and tagger must
    # import and run on a machine that cannot install it, or the extra is a lie.
    name: Core install, no Pythia8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the core package only
        run: pip install -e ".[dev]"

      - name: Assert Pythia8 really is absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          for name in ("pythia8mc", "pythia8"):
              if importlib.util.find_spec(name) is not None:
                  sys.exit(f"{name} is installed; this job cannot prove anything")
          print("no Pythia8 present, as intended")
          PY

      - name: Import the Pythia-free half of the package
        run: |
          python -c "
          import jetgo, jetgo.observables, jetgo.taggers, jetgo.kinematics
          print('jetgo', jetgo.__version__, 'imports without Pythia8')
          "

      - name: Run the tests that do not need a generator
        run: pytest -v -m "not pythia"

  test-macos:
    # No pythia8mc wheels for macOS, so this runs the generator-free tier only.
    name: macOS, no Pythia8
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the core package only
        run: pip install -e ".[dev]"

      - name: Run the tests that do not need a generator
        run: pytest -v -m "not pythia"

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - run: python -m build

      - run: twine check dist/*
